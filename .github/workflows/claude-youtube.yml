name: Claude Code (YouTube admin)

# A separate, deliberately small workflow for anything that needs FULL control
# of the BYU Vertical Cloud Lab YouTube channel (delete, edit, playlists,
# captions). Plain @claude runs only get the upload-only token. Mirrors
# byu-vcl's claude-youtube.yml; see the YouTube section of CLAUDE.md.
#
# Three gates, any one of which stops a run:
#   1. The `if:` below: only @claude-youtube, and only from sgbaird.
#   2. The `youtube-admin` environment requires sgbaird to approve every run
#      (Actions tab -> the waiting run -> Review deployments). This is the gate
#      that holds even if someone edits this file.
#   3. That environment only deploys from main, so a workflow pushed on any
#      other branch cannot read its secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude-youtube:
    if: |
      github.actor == 'sgbaird' && (
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude-youtube')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude-youtube') || contains(github.event.issue.title, '@claude-youtube')))
      )
    runs-on: ubuntu-latest
    environment: youtube-admin
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Same ephemeral tailnet join as claude.yml (the federated identity only
      # mints keys for all four tags together). Useful because YouTube blocks
      # yt-dlp downloads from datacenter IPs, so pulling channel video has to go
      # through a Pi's residential IP. Not needed for API calls.
      - name: Connect to Tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:rpi-5-3ray,tag:rpi-5-6ktj,tag:rpi-zero2w-ex3f,tag:rpi-5-des4

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Environment secret (youtube-admin): full channel control, including delete.
          YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
          # Repo secret: upload + read only, the same one every @claude run gets.
          YOUTUBE_UPLOAD_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_UPLOAD_TOKEN_PICKLE_B64 }}
          # Lab Pis, reached over the tailnet joined above (see CLAUDE.md).
          PANEL_CAM_PASSWORD: ${{ secrets.PANEL_CAM_PASSWORD }}
          PANEL_CAM_USERNAME: ${{ vars.PANEL_CAM_USERNAME }}
          PANEL_CAM_HOSTNAME: ${{ vars.PANEL_CAM_HOSTNAME }}
          HMI_CAM_PASSWORD: ${{ secrets.HMI_CAM_PASSWORD }}
          HMI_CAM_USERNAME: ${{ vars.HMI_CAM_USERNAME }}
          HMI_CAM_HOSTNAME: ${{ vars.HMI_CAM_HOSTNAME }}
          ROOM_CAM_PASSWORD: ${{ secrets.ROOM_CAM_PASSWORD }}
          ROOM_CAM_USERNAME: ${{ vars.ROOM_CAM_USERNAME }}
          ROOM_CAM_HOSTNAME: ${{ vars.ROOM_CAM_HOSTNAME }}
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-youtube"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5 --effort max
            --permission-mode bypassPermissions
