name: Tailscale check

# Manual, read-only proof that CI can reach the lab Pis (panel, HMI and room cameras): joins the tailnet the same
# way claude.yml does (federated identity, no stored secret), shows the tags the
# runner was given, and checks that each Pi answers on tcp:22. For each Pi whose
# *_USERNAME is set it also logs in over Tailscale SSH and runs hostname/uptime/id,
# nothing else.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PANEL_CAM_USERNAME: ${{ vars.PANEL_CAM_USERNAME }}
      PANEL_CAM_HOSTNAME: ${{ vars.PANEL_CAM_HOSTNAME }}
      HMI_CAM_USERNAME: ${{ vars.HMI_CAM_USERNAME }}
      HMI_CAM_HOSTNAME: ${{ vars.HMI_CAM_HOSTNAME }}
      ROOM_CAM_USERNAME: ${{ vars.ROOM_CAM_USERNAME }}
      ROOM_CAM_HOSTNAME: ${{ vars.ROOM_CAM_HOSTNAME }}
    steps:
      - name: Connect to Tailscale
        id: join
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:rpi-5-3ray,tag:rpi-5-6ktj,tag:rpi-zero2w-ex3f

      - name: Runner tags and peer status
        run: |
          tailscale status --json | jq '{self_tags: .Self.Tags, peers: [.Peer[] | {online: .Online, tags: .Tags}]}'

      # Each Pi is checked on its own: one being offline must not hide the other's result.
      - name: Panel camera Pi answers on tcp:22
        id: panel_tcp
        if: ${{ !cancelled() && steps.join.outcome == 'success' }}
        run: |
          timeout 20 bash -c "until nc -z -w 3 \"$PANEL_CAM_HOSTNAME\" 22; do sleep 2; done"
          echo "tcp:22 reachable"

      - name: Panel camera Pi read-only SSH login
        if: ${{ !cancelled() && steps.panel_tcp.outcome == 'success' && env.PANEL_CAM_USERNAME != '' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$PANEL_CAM_USERNAME@$PANEL_CAM_HOSTNAME" 'hostname >/dev/null && uptime -p && id -un && uname -m'

      - name: HMI camera Pi answers on tcp:22
        id: hmi_tcp
        if: ${{ !cancelled() && steps.join.outcome == 'success' }}
        run: |
          timeout 20 bash -c "until nc -z -w 3 \"$HMI_CAM_HOSTNAME\" 22; do sleep 2; done"
          echo "tcp:22 reachable"

      - name: HMI camera Pi read-only SSH login
        if: ${{ !cancelled() && steps.hmi_tcp.outcome == 'success' && env.HMI_CAM_USERNAME != '' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$HMI_CAM_USERNAME@$HMI_CAM_HOSTNAME" 'hostname >/dev/null && uptime -p && id -un && uname -m'

      - name: Room camera answers on tcp:22
        id: room_tcp
        if: ${{ !cancelled() && steps.join.outcome == 'success' }}
        run: |
          timeout 20 bash -c "until nc -z -w 3 \"$ROOM_CAM_HOSTNAME\" 22; do sleep 2; done"
          echo "tcp:22 reachable"

      - name: Room camera read-only SSH login
        if: ${{ !cancelled() && steps.room_tcp.outcome == 'success' && env.ROOM_CAM_USERNAME != '' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$ROOM_CAM_USERNAME@$ROOM_CAM_HOSTNAME" 'hostname >/dev/null && uptime -p && id -un && uname -m'
