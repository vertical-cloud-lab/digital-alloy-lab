name: Tailscale check

# Manual, read-only proof that CI can reach the lab Pis: joins the tailnet the same
# way claude.yml does (federated identity, no stored secret), shows the tags the
# runner was given, and checks that each Pi answers on tcp:22. For each Pi whose
# *_USERNAME is set it also logs in over Tailscale SSH and runs hostname/uptime/id,
# nothing else.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PI_USERNAME: ${{ vars.PI_USERNAME }}
      PI_HOSTNAME: ${{ vars.PI_HOSTNAME }}
      PI2_USERNAME: ${{ vars.PI2_USERNAME }}
      PI2_HOSTNAME: ${{ vars.PI2_HOSTNAME }}
    steps:
      - name: Connect to Tailscale
        id: join
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:rpi-5-3ray,tag:rpi-5-6ktj

      - name: Runner tags and peer status
        run: |
          tailscale status --json | jq '{self_tags: .Self.Tags, peers: [.Peer[] | {online: .Online, tags: .Tags}]}'

      # Each Pi is checked on its own: one being offline must not hide the other's result.
      - name: Pi answers on tcp:22
        id: pi_tcp
        if: ${{ !cancelled() && steps.join.outcome == 'success' }}
        run: |
          timeout 20 bash -c "until nc -z -w 3 \"$PI_HOSTNAME\" 22; do sleep 2; done"
          echo "tcp:22 reachable"

      - name: Pi read-only SSH login
        if: ${{ !cancelled() && steps.pi_tcp.outcome == 'success' && env.PI_USERNAME != '' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$PI_USERNAME@$PI_HOSTNAME" 'hostname >/dev/null && uptime -p && id -un && uname -m'

      - name: Pi 2 answers on tcp:22
        id: pi2_tcp
        if: ${{ !cancelled() && steps.join.outcome == 'success' }}
        run: |
          timeout 20 bash -c "until nc -z -w 3 \"$PI2_HOSTNAME\" 22; do sleep 2; done"
          echo "tcp:22 reachable"

      - name: Pi 2 read-only SSH login
        if: ${{ !cancelled() && steps.pi2_tcp.outcome == 'success' && env.PI2_USERNAME != '' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$PI2_USERNAME@$PI2_HOSTNAME" 'hostname >/dev/null && uptime -p && id -un && uname -m'
